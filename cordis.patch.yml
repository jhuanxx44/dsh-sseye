# dsh-sseye bundle patch: inserts the plugin row into any profile that
# installs this package. `dsh plugin --profile <name> add dsh-sseye` appends
# this package to the profile's dsh.profile.bundles layer list because the
# manifest declares dsh.bundle.patch; at boot the composer applies this patch
# and the row below activates with the rest of the composition.

- insert:
    - id: sseye
      name: dsh-sseye
